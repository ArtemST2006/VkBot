name: vkbot

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5555}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vkdb}"
      POSTGRES_USER: "${POSTGRES_USER:-vkuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tty}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  postgres_data:
