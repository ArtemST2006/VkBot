name: vkbot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5555}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vkdb}"
      POSTGRES_USER: "${POSTGRES_USER:-vkuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tty}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  vkbot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-vkuser}:${POSTGRES_PASSWORD:-tty}@postgres:5432/${POSTGRES_DB:-vkdb}?sslmode=disable"

volumes:
  postgres_data:
